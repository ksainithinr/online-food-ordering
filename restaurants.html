<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — Savora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">S</span> Savora</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a class="active" href="restaurants.html">Restaurants</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost cart-btn" href="cart.html">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
      </div>
    </div>
  </header>
  <main class="container section">
    <p class="kicker">Browse</p>
    <h2>All restaurants</h2>
    <form class="search-bar" style="margin:18px 0 22px" onsubmit="return false">
      <input data-search placeholder="Search kitchens or cuisines" aria-label="Search">
    </form>
    <div class="filters" data-filters></div>
    <div class="grid" data-restaurants></div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner"><span>© 2026 Savora</span></div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
