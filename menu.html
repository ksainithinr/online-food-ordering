<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu — Savora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-mark">S</span> Savora</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a class="active" href="restaurants.html">Restaurants</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost cart-btn" href="cart.html">Cart <span class="cart-count" data-cart-count hidden>0</span></a>
      </div>
    </div>
  </header>
  <main class="container section">
    <a href="restaurants.html" class="kicker">← All restaurants</a>
    <div class="hero" style="padding-top:18px">
      <div>
        <h1 data-rest-name>Menu</h1>
        <p class="lede" data-blurb></p>
        <div class="meta" data-rest-meta style="margin-top:12px"></div>
      </div>
      <img data-hero-img alt="" style="width:100%;height:260px;object-fit:cover;border-radius:28px">
    </div>
    <div class="menu-layout">
      <div data-menu></div>
      <aside class="cart-panel" data-cart-panel></aside>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner"><span>© 2026 Savora</span></div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
